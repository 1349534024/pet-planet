services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pet-planet-api:1.0.0
    container_name: pet-planet-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      DEBUG: "false"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pet_planet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pet123456}
      DATABASE_URL: mysql+pymysql://pet:${MYSQL_PASSWORD:-pet123456}@mysql:3306/${MYSQL_DATABASE:-pet_planet}
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_DIR: /app/data/chroma
      OBJECT_STORAGE_PROVIDER: local
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-http://localhost:8000/static}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_chroma_data:/app/data/chroma
      - app_uploads:/app/static/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        python -c \"import os,time,pymysql;
        url=os.environ['DATABASE_URL'];
        host='mysql'; port=3306; user='pet'; password=os.environ.get('MYSQL_PASSWORD','pet123456'); database=os.environ.get('MYSQL_DATABASE','pet_planet');
        deadline=time.time()+120;
        last=None;
        while time.time()<deadline:
            try:
                conn=pymysql.connect(host=host,port=port,user=user,password=password,database=database,connect_timeout=3);
                conn.close();
                print('mysql is ready');
                break
            except Exception as exc:
                last=exc;
                print(f'waiting for mysql: {exc}');
                time.sleep(2)
        else:
            raise SystemExit(f'mysql is not ready: {last}')\"
        alembic upgrade head
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-2}
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  mysql:
    image: mysql:8.4
    container_name: pet-planet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pet_planet}
      MYSQL_USER: pet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pet123456}
      TZ: Asia/Shanghai
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs automatically only when the MySQL data directory is initialized for the first time.
      - ./backend/scripts/init_mysql.sql:/docker-entrypoint-initdb.d/01-init-mysql.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: pet-planet-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
  app_chroma_data:
  app_uploads:
